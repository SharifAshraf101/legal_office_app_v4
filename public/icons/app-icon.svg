<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640"><rect width="640" height="640" fill="#FDFBF5"/><g transform="translate(320,320) scale(0.78) translate(-320,-303)">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0" stop-color="#b07515"/>
      <stop offset="0.45" stop-color="#e8b64a"/>
      <stop offset="0.55" stop-color="#f4d27e"/>
      <stop offset="1" stop-color="#a86c12"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b79bfa"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="blue" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ad6f5"/><stop offset="1" stop-color="#2ea8ad"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd9b8"/><stop offset="1" stop-color="#1f9e8a"/>
    </linearGradient>
    <linearGradient id="orange" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fbc94a"/><stop offset="1" stop-color="#e8920c"/>
    </linearGradient>
    <radialGradient id="heart" cx="0.38" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2fb"/>
    </radialGradient>
    <radialGradient id="pistil" cx="0.4" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <!-- one petal: three rounded corners, sharp corner pointing at the flower center -->
    <path id="petal" d="M -7 -7 L -101 -7 A 85 85 0 0 1 -186 -92 L -186 -101 A 85 85 0 0 1 -101 -186 L -92 -186 A 85 85 0 0 1 -7 -101 Z"/>
  </defs>

  <!-- petals around center (320,200) -->
  <g transform="translate(320,200)">
    <use href="#petal" fill="url(#purple)" stroke="#8b5cf6" stroke-width="3"/>
    <use href="#petal" transform="scale(-1,1)"  fill="url(#blue)"   stroke="#38bdf8" stroke-width="3"/>
    <use href="#petal" transform="scale(1,-1)"  fill="url(#teal)"   stroke="#14b8a6" stroke-width="3"/>
    <use href="#petal" transform="scale(-1,-1)" fill="url(#orange)" stroke="#f59e0b" stroke-width="3"/>
  </g>

  <!-- scales of justice, column growing from the flower's heart -->
  <g transform="translate(320,200) scale(0.66) translate(-221,0)">
    <rect x="200" y="0" width="10" height="555" fill="url(#gold)"/>
    <rect x="214" y="0" width="14" height="555" fill="url(#gold)"/>
    <rect x="232" y="0" width="10" height="555" fill="url(#gold)"/>
    <path d="M221 307 L128 341 L35 341"  fill="none" stroke="url(#gold)" stroke-width="11" stroke-linejoin="round"/>
    <path d="M221 307 L314 341 L407 341" fill="none" stroke="url(#gold)" stroke-width="11" stroke-linejoin="round"/>
    <circle cx="62" cy="357" r="10" fill="url(#gold)"/>
    <circle cx="62" cy="374" r="5"  fill="url(#gold)"/>
    <circle cx="380" cy="357" r="10" fill="url(#gold)"/>
    <circle cx="380" cy="374" r="5"  fill="url(#gold)"/>
    <text x="92"  y="471" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif" font-weight="bold" font-size="96" fill="url(#gold)">A</text>
    <text x="352" y="471" text-anchor="middle" font-family="DejaVu Serif, Georgia, serif" font-weight="bold" font-size="72" letter-spacing="-3" fill="url(#gold)">SH</text>
    <rect x="27"  y="481" width="130" height="13" fill="url(#gold)"/>
    <rect x="40"  y="499" width="104" height="11" fill="url(#gold)"/>
    <rect x="287" y="481" width="130" height="13" fill="url(#gold)"/>
    <rect x="300" y="499" width="104" height="11" fill="url(#gold)"/>
    <rect x="136" y="555" width="170" height="17" fill="url(#gold)"/>
    <rect x="96"  y="577" width="250" height="19" fill="url(#gold)"/>
  </g>

  <!-- flower heart on top -->
  <circle cx="320" cy="200" r="58" fill="url(#heart)" stroke="#dbe4f3" stroke-width="5"/>
  <circle cx="320" cy="200" r="20" fill="url(#pistil)"/>
  <circle cx="320" cy="200" r="27" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="6"/>
</g></svg>