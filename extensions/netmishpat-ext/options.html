<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>הגדרות – גשר נט המשפט</title>
<style>
  body { font: 15px Arial, sans-serif; max-width: 520px; margin: 30px auto; color: #1b3a5f; background: #f7f4ec; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input { width: 100%; padding: 8px; box-sizing: border-box; direction: ltr; }
  button { margin-top: 16px; padding: 9px 18px; background: #1b3a5f; color: #f3e3b5; border: 1px solid #b8963e; border-radius: 6px; cursor: pointer; }
  #msg { margin-top: 10px; }
  small { color: #555; }
</style>
</head>
<body>
  <h2>⚖ הגדרות גשר נט המשפט</h2>
  <label for="endpoint">כתובת ה-Worker</label>
  <input id="endpoint" placeholder="https://legal-office-api-v4.<account>.workers.dev">
  <small>הכתובת של ה-Worker ‏legal-office-api-v4 שלך.</small>
  <label for="token">טוקן גישה (NM_BRIDGE_TOKEN)</label>
  <input id="token" type="password" placeholder="••••••••">
  <small>אותו ערך שהגדרת ב-<code>wrangler secret put NM_BRIDGE_TOKEN</code>. נשמר במחשב זה בלבד.</small>
  <br><button id="save">שמור</button>
  <div id="msg"></div>
  <script src="options.js"></script>
</body>
</html>
