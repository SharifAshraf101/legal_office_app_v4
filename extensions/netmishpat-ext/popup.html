<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  body { font: 14px Arial, sans-serif; width: 290px; margin: 0; padding: 14px; background: #f7f4ec; color: #1b3a5f; }
  h1 { font-size: 15px; margin: 0 0 6px; }
  #site { font-size: 12px; color: #555; margin-bottom: 8px; direction: ltr; text-align: right; word-break: break-all; }
  button { width: 100%; padding: 9px; margin: 4px 0; border: 1px solid #b8963e; border-radius: 6px;
           background: #1b3a5f; color: #f3e3b5; font-weight: 600; cursor: pointer; }
  button.sec { background: #fff; color: #1b3a5f; }
  button[hidden] { display: none; }
  #status { margin-top: 8px; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
  <h1>⚖ גשר נט המשפט / נט בתי הדין</h1>
  <div id="site"></div>
  <button id="enable" hidden>הפעל את הגשר באתר הזה (נט בתי הדין השרעיים)</button>
  <button id="send">שלח את העמוד הנוכחי למערכת</button>
  <button id="opts" class="sec">הגדרות</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
